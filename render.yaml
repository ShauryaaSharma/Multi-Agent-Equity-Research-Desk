# Render Blueprint — AERD backend (free tier)
# Dashboard: New → Blueprint → connect this repo, or create services manually using SHIPPING.md
#
# Creates: 1 Postgres (free) + 1 Python web service (Django/Daphne)
# Frontend deploys separately on Vercel (see SHIPPING.md).

databases:
  - name: aerd-db
    plan: free
    databaseName: aerd
    user: aerd

services:
  - type: web
    name: aerd-api
    runtime: python
    plan: free
    rootDir: api_core
    buildCommand: bash build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT aerd_conf.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aerd-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_EXTRA_ORIGINS
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FEATURE_GENAI_INSIGHTS
        value: "true"
      - key: FEATURE_AGENTS
        value: "true"
      - key: FEATURE_QUANT_SIGNALS
        value: "true"
      - key: FEATURE_WEBSOCKETS
        value: "true"
      # Optional on free tier (no Redis service):
      # - key: REDIS_URL
      #   sync: false
